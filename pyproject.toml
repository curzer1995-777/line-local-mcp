[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "line-local-mcp"
version = "0.1.0"
description = "Read-only MCP server for searching a user's local LINE Desktop history on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LINE Local MCP contributors" }]
keywords = ["line", "mcp", "model-context-protocol", "macos", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "apsw-sqlite3mc>=3.50",
  "mcp>=1.13,<2",
]

[project.scripts]
line-local-mcp = "line_local_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/curzer1995-777/line-local-mcp"
Repository = "https://github.com/curzer1995-777/line-local-mcp"
Issues = "https://github.com/curzer1995-777/line-local-mcp/issues"
Changelog = "https://github.com/curzer1995-777/line-local-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/curzer1995-777/line-local-mcp/security/policy"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/line_local_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
