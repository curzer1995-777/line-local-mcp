name: Bug report
description: Report a reproducible problem without sharing private LINE data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never attach real LINE databases, messages, identifiers, keys, memory dumps, or private paths. Report security issues privately through SECURITY.md.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no real chat data, credentials, account identifiers, or other private information.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
  - type: input
    id: version
    attributes:
      label: Project version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS, Mac architecture, LINE Desktop, and Python versions
      placeholder: macOS 26.x, Apple Silicon, LINE 9.x, Python 3.12
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps using synthetic data only.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted doctor result
      description: Paste only non-sensitive status from `line-local-mcp --doctor`.
      render: text
